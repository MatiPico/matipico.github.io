<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MatiPico</title>
  <meta
    name="description"
    content="MatiPicoは、九九をしっかり身につけるための学習アプリです。"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      color: #1f2937;
      background: #f8fafc;
      line-height: 1.7;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 42px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0 0 40px;
      font-size: 20px;
      color: #475569;
    }

    .description {
      margin-bottom: 48px;
      font-size: 16px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .links a {
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #0f172a;
      text-decoration: none;
      background: #ffffff;
    }

    .links a:hover {
      background: #f1f5f9;
    }

    footer {
      margin-top: 72px;
      padding-top: 24px;
      border-top: 1px solid #e2e8f0;
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <main>
    <h1>MatiPico</h1>

    <p class="subtitle">
      九九を、解けるだけでなく「すぐ思い出せる」まで。
    </p>

    <div class="description">
      <p>
        MatiPicoは、九九を効率よく身につけるための学習アプリです。
      </p>

      <p>
        通常の九九練習に加えて、苦手な問題の練習、
        記憶定着を意識した練習、スピードテスト、
        学習状況の確認などができます。
      </p>
    </div>

    <div class="links">
      <a href="https://matipico.github.io/mati-pico-web/support.html">
        サポート
      </a>

      <a href="https://matipico.github.io/mati-pico-web/privacy-policy.html">
        プライバシーポリシー
      </a>
    </div>

    <footer>
      © 2026 Takayuki Wakimoto
    </footer>
  </main>
</body>
</html>
